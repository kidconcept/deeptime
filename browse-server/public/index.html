<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COG Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <div id="map">
      <div id="loading-overlay">
        <video autoplay loop muted playsinline>
          <source src="image/wiseturtle.webm" type="video/webm">
        </video>
        <p>Loading coral reef data, thanks for your patience while our tiles are streaming. It takes a moment to warm up the COG server. This project is under development, come back for more data and more features!</p>
      </div>
    </div>
    <div id="tray">
      <div id="cog-selector" class="tray-section">
        <label for="cog-selector-dropdown">Select COG:</label>
        <select id="cog-selector-dropdown"></select>
      </div>
      
      <div id="map-info" class="tray-section">
        <h3>Map Info</h3>
        <div id="map-info-content"></div>
      </div>
      
      <div id="tools" class="tray-section">
        <h3>Tools</h3>
        <div class="tool-item">
          <button id="coordinates-tool-btn" class="tool-icon-button coordinates-marker-icon" title="Show Coordinates">
          </button>
          <label class="tool-label">Coordinates</label>
        </div>
        <div class="tool-item">
          <button id="measure-tool-btn" class="tool-icon-button measure-ruler-icon" title="Measure Distance">
          </button>
          <label class="tool-label">Measure</label>
        </div>
      </div>
      
      <div id="messages" class="tray-section">
        <h3>Messages</h3>
        <div id="messages-content"></div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
