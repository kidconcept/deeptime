<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepTime - COG Browser</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  
  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🗺️ DeepTime COG Browser</h1>
      <div class="header-info">
        <span id="coordinates" class="coordinates">Click map for coordinates</span>
      </div>
    </header>

    <!-- COG Selector -->
    <div class="controls">
      <label for="cog-selector">Select COG:</label>
      <select id="cog-selector">
        <option value="">-- Select a COG file --</option>
        <!-- Options will be populated by viewer.js -->
      </select>
      <div id="loading-indicator" class="loading hidden">Loading...</div>
      <div id="coord-system-indicator" class="coord-system hidden"></div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Footer -->
    <footer class="footer">
      <p>Powered by <a href="https://leafletjs.com" target="_blank">Leaflet</a> + 
         <a href="https://developmentseed.org/titiler/" target="_blank">TiTiler</a></p>
    </footer>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  
  <!-- Custom viewer script with cache busting -->
  <script src="viewer.js"></script>
</body>
</html>
